services:
  - type: web
    name: daily-blog-automation
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py --schedule --live
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_FALLBACK_MODEL
        value: qwen/qwen3.8-27b
      - key: NOTION_API_KEY
        sync: false
      - key: NOTION_DATABASE_ID
        sync: false
      - key: DRY_RUN
        value: "false"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: RUN_HOUR
        value: "8"
      - key: RUN_MINUTE
        value: "0"
      - key: TIMEZONE
        value: "Asia/Kolkata"
